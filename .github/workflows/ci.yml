name: CI

on:
  push:
    branches: ['master', 'milestone-*', 'wporg-*']
  pull_request:

env:
  SLUG: open-badges-for-learndash

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --prefer-dist --no-progress

      - name: Coding standards (PHPCS / WPCS)
        run: vendor/bin/phpcs

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit

  build-release:
    name: Release archive + Plugin Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the block
        run: |
          npm ci
          npm run build

      # The plugin has no runtime Composer dependencies and ships its own
      # PSR-4 autoloader, so no vendor/ directory is staged. Files are staged
      # by explicit allow-list, so a new development file can never be swept
      # into a release by accident.
      - name: Stage the plugin
        run: |
          set -euo pipefail
          mkdir -p "dist/$SLUG"
          cp open-badges-for-learndash.php uninstall.php readme.txt README.md LICENSE "dist/$SLUG/"
          cp -R src build blocks languages docs "dist/$SLUG/"
          test -f "dist/$SLUG/build/earned-badges/block.json"
          test -f "dist/$SLUG/languages/$SLUG.pot"
          test -f "dist/$SLUG/docs/faq.md"
          # Header, constant and readme must agree on the version.
          header=$(sed -n 's/^ \* Version: *//p' "dist/$SLUG/$SLUG.php")
          const=$(sed -n "s/^define( 'OBLD_VERSION', '\(.*\)' );/\1/p" "dist/$SLUG/$SLUG.php")
          stable=$(sed -n 's/^Stable tag: *//p' "dist/$SLUG/readme.txt")
          echo "header=$header const=$const stable=$stable"
          test "$header" = "$const" && test "$header" = "$stable"

      - name: Assert no development files were included
        run: |
          set -euo pipefail
          for unwanted in tests _build_plan dan-docs node_modules vendor .github .wordpress-org \
                          composer.json composer.lock package.json package-lock.json \
                          phpunit.xml.dist phpcs.xml.dist .distignore .gitignore .phpunit.result.cache; do
            if [ -e "dist/$SLUG/$unwanted" ]; then
              echo "Development path leaked into the release archive: $unwanted"
              exit 1
            fi
          done

      # The same checks the WordPress.org review team runs on submission.
      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/${{ env.SLUG }}

      - name: Create the archive
        run: |
          set -euo pipefail
          cd dist && zip -rq "$SLUG.zip" "$SLUG"
          ls -l "$SLUG.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/open-badges-for-learndash.zip
          if-no-files-found: error

  # Proves the archive activates on a clean install at both ends of the
  # declared support range, rather than assuming it.
  smoke-test:
    name: Install on WP ${{ matrix.wp }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.5'
            php: '8.1'
          - wp: 'latest'
            php: '8.1'
          - wp: 'latest'
            php: '8.4'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli

      - name: Install WordPress and activate the plugin
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE wp;"
          mkdir wordpress && cd wordpress
          wp core download --version="${{ matrix.wp }}"
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --url=http://localhost --title=Test \
            --admin_user=admin --admin_password=pw --admin_email=test@example.com
          wp core version
          wp plugin install ../open-badges-for-learndash.zip --activate
          wp plugin list --name=open-badges-for-learndash --field=status | grep -qx active

      - name: Activation created the tables and loads without notices
        run: |
          set -euo pipefail
          cd wordpress
          wp eval 'foreach ( array( "badges", "triggers", "awards", "logs" ) as $t ) {
            global $wpdb;
            $name = $wpdb->prefix . "obld_" . $t;
            if ( $wpdb->get_var( $wpdb->prepare( "SHOW TABLES LIKE %s", $name ) ) !== $name ) {
              echo "missing table: $name\n"; exit( 1 );
            }
          } echo "all tables present\n";'
          # The autoloader must resolve every class without Composer.
          wp eval 'echo class_exists( "OBLD\\Plugin" ) && class_exists( "OBLD\\Issuance\\StatusSync" ) ? "autoload ok\n" : "autoload FAILED\n";' | grep -q "autoload ok"
          # The block registered from the built block.json.
          wp eval 'echo WP_Block_Type_Registry::get_instance()->is_registered( "obld/earned-badges" ) ? "block ok\n" : "block FAILED\n";' | grep -q "block ok"
          # A front-end request renders with no PHP warnings or notices.
          wp eval 'echo do_shortcode( "[user_badges]" ), "\n";' 2>&1 | tee out.txt
          ! grep -qiE "warning|notice|deprecated|fatal" out.txt
          wp plugin deactivate open-badges-for-learndash
          wp plugin uninstall open-badges-for-learndash
